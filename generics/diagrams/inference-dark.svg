<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="A generic call is checked by inferring T from its arguments: one candidate gives a type, no candidate gives unknown, disagreeing candidates give an error">
<defs>
<marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e6e9ee"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e8877a"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#86c79a"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6fc1c9"/></marker>
</defs>
<rect x="0.5" y="0.5" width="999" height="399" rx="14" fill="#1c2028" stroke="#2d333b"/>
<polyline points="240,200 300,200" fill="none" stroke="#e6e9ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/>
<polyline points="410,138 410,74 640,74" fill="none" stroke="#86c79a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<polyline points="520,200 640,200" fill="none" stroke="#e6e9ee" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/>
<polyline points="410,262 410,326 640,326" fill="none" stroke="#e8877a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow-red)"/>
<rect x="30" y="158" width="210" height="84" rx="10" fill="#1c2028" stroke="#8b93a1" stroke-width="1.5"/>
<text x="135" y="183" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Generic call</text>
<text x="135" y="205" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab2bf" text-anchor="middle">the arguments are</text>
<text x="135" y="227" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab2bf" text-anchor="middle">the evidence for T</text>
<polygon points="410,138 520,200 410,262 300,200" fill="#1c2028" stroke="#6fc1c9" stroke-width="2.5" stroke-linejoin="round"/>
<text x="410" y="205" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Infer T</text>
<rect x="640" y="24" width="330" height="100" rx="10" fill="#1c2028" stroke="#8b93a1" stroke-width="1.5"/>
<text x="805" y="46" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">One candidate</text>
<text x="805" y="68" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab2bf" text-anchor="middle">first(['Alice', 'Bob'])</text>
<text x="805" y="90" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab2bf" text-anchor="middle">T = string</text>
<text x="805" y="112" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#86c79a" text-anchor="middle">result: string | undefined</text>
<rect x="640" y="150" width="330" height="100" rx="10" fill="#1c2028" stroke="#8b93a1" stroke-width="1.5"/>
<text x="805" y="172" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">No candidate</text>
<text x="805" y="194" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab2bf" text-anchor="middle">emptyList()</text>
<text x="805" y="216" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab2bf" text-anchor="middle">T = unknown</text>
<text x="805" y="238" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e6e9ee" text-anchor="middle">write emptyList&lt;string&gt;()</text>
<rect x="640" y="276" width="330" height="100" rx="10" fill="#1c2028" stroke="#8b93a1" stroke-width="1.5"/>
<text x="805" y="298" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Candidates disagree</text>
<text x="805" y="320" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab2bf" text-anchor="middle">pairOf('Alice', 42)</text>
<text x="805" y="342" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#aab2bf" text-anchor="middle">T cannot be string and number</text>
<text x="805" y="364" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#e8877a" text-anchor="middle">compile error</text>
</svg>

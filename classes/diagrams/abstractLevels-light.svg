<text x="920" y="440" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#424a53" text-anchor="end">Teal boxes are abstract, green boxes can be created with new.</text>
